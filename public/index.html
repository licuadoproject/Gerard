"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjc15MWE2B9y0dKtiTrNR3pH8rh71vrSQnzyvlVAHKfH4zoO3AgjIYGT3-oVIy_KEEJ6OC3xnqGWV1Dqx05xbRDlHd71C8RNV3p3DOINYLKtf9L2uMkpVoP5DhBI0zpXoYbWzxl865h1Bq4qr72h46XpXKIg5NwNA6y0JVew8Fx_hb66wUf7g2dUvF1jzM6/s1600/IMG_20261103_120519.jpg",
"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhParblk6Mf2VlWI2DEc4lT-1CRALIjiiJ-sC1UwYjfduyNiow_gkazXXXEqf6jvG-PnCmqXP8Riv5iJc8bz1CIk-RZ80y2-3gQS2qtN1WocAWnoprmn-nmuxSFPErS-lUxNz3-dGyx2PZNNjPS3b9f6mOLusmTu9lGghGZeSKUvHVZZof5Jh9scrJORf8W/s1600/IMG_20261103_120516.jpg"
  ];
  const SONGS=['-xUkPo2q3zc','-N5oZH74wEA','xVS4zgb9AuU'];
  const WORDS=['AURA +1000','GERARD','+9999 AURA','AURA FARMING','SIGMA','W','🔥🔥🔥','NO CAP','FRFR','AURA INFINITA','LOCKED IN','-100 AURA ❌','+1M AURA'];
  const $=id=>document.getElementById(id);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

  /* ---------- MÚSICA (YouTube, aleatoria y en bucle) ---------- */
  let player=null,ytReady=false,wantPlay=false,queue=[],lastId=null,errs=0;
  function nextId(){
    if(!queue.length){queue=shuffle(SONGS.slice());if(queue[0]===lastId&&queue.length>1)queue.push(queue.shift())}
    lastId=queue.shift();return lastId;
  }
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player('yt',{width:'200',height:'200',videoId:nextId(),
      playerVars:{playsinline:1,controls:0,rel:0,disablekb:1,fs:0},
      events:{
        onReady:()=>{ytReady=true;if(wantPlay){player.unMute();player.setVolume(100);player.playVideo()}},
        onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){player.loadVideoById(nextId())}if(e.data===YT.PlayerState.PLAYING)errs=0},
        onError:()=>{if(++errs<=6)player.loadVideoById(nextId())}
      }});
  };

  /* ---------- FUEGO LOW-RES (estilo Doom) ---------- */
  const FW=160,FH=90;
  const fire=$('fire'),fire2=$('fire2');
  fire.width=fire2.width=FW;fire.height=fire2.height=FH;
  const fx=fire.getContext('2d'),fx2=fire2.getContext('2d');
  const fimg=fx.createImageData(FW,FH),grid=new Uint8Array(FW*FH);
  const stops=[[0,[0,0,0]],[6,[70,5,0]],[12,[160,25,0]],[18,[230,80,5]],[25,[255,150,20]],[31,[255,215,70]],[36,[255,255,235]]];
  const pal=[];
  for(let i=0;i<=36;i++){
    let a=stops[0],b=stops[stops.length-1];
    for(let s=0;s<stops.length-1;s++){if(i>=stops[s][0]&&i<=stops[s+1][0]){a=stops[s];b=stops[s+1];break}}
    const t=(i-a[0])/Math.max(1,b[0]-a[0]);
    pal.push([0,1,2].map(k=>Math.round(a[1][k]+(b[1][k]-a[1][k])*t)));
  }
  let power=.4,base=.4,playing=false;
  function stepFire(){
    const last=(FH-1)*FW;
    for(let x=0;x<FW;x++)grid[last+x]=Math.min(36,Math.round(36*Math.min(power,1)*(.75+Math.random()*.25)));
    for(let y=1;y<FH;y++){for(let x=0;x<FW;x++){
      const i=y*FW+x,v=grid[i];
      if(!v){grid[i-FW]=0}else{const r=(Math.random()*3)|0;const d=i-r+1;grid[d-FW]=v-(r&1)}
    }}
    const d=fimg.data;
    for(let i=0;i<grid.length;i++){const c=pal[grid[i]];const o=i*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}
    fx.putImageData(fimg,0,0);
    fx2.save();fx2.translate(0,FH);fx2.scale(1,-1);fx2.drawImage(fire,0,0);fx2.restore();
  }
  let lastT=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(t-lastT<33)return;lastT=t;
    power=Math.max(base,power-.035);
    stepFire();
  }
  requestAnimationFrame(loop);

  /* ---------- FOTOS ---------- */
  const photo=$('photo'),pctx=photo.getContext('2d'),bg=$('bg'),bctx=bg.getContext('2d');
  const stage=$('stage'),flash=$('flash'),txt=$('txt');
  const loaded=[];
  let pending=IMGS.length;
  IMGS.forEach(src=>{
    const im=new Image();
    im.onload=()=>{loaded.push(im);pending--};
    im.onerror=()=>{pending--};
    im.src=src;
  });

  function drawLow(im){
    const L=200,r=im.naturalWidth/im.naturalHeight;
    const w=r>=1?L:Math.round(L*r),h=r>=1?Math.round(L/r):L;
    photo.width=w;photo.height=h;
    pctx.imageSmoothingEnabled=true;pctx.drawImage(im,0,0,w,h);
    const k=Math.min(innerWidth*.92/w,innerHeight*.92/h);
    photo.style.width=Math.round(w*k)+'px';photo.style.height=Math.round(h*k)+'px';
    bg.width=48;bg.height=Math.max(1,Math.round(48*innerHeight/innerWidth));
    bctx.drawImage(im,0,0,bg.width,bg.height);
  }
  addEventListener('resize',()=>{if(cur)drawLow(cur)});

  const G='contrast(1.35) saturate(1.6) sepia(.35) hue-rotate(-10deg) brightness(1.05)';
  const GL=G+' drop-shadow(10px 0 0 rgba(255,0,0,.85)) drop-shadow(-10px 0 0 rgba(0,255,255,.85))';
  const GB=G+' brightness(3) saturate(0)';
  const EFFECTS=[
    [{transform:'scale(.45)',opacity:0},{transform:'scale(1.14)',opacity:1,offset:.12},{transform:'scale(.98)',offset:.24},{transform:'scale(1.1)'}],
    [{transform:'rotate(-28deg) scale(1.9)',opacity:0},{transform:'rotate(4deg) scale(1)',opacity:1,offset:.16},{transform:'rotate(-2deg) scale(1.08)'}],
    [{transform:'translateX(-120vw) skewX(32deg)',opacity:1},{transform:'translateX(0) skewX(-7deg)',offset:.14},{transform:'translateX(0) skewX(0) scale(1.12)'}],
    [{transform:'translateY(-115vh) scale(1.3)',opacity:1},{transform:'translateY(0) scale(1)',offset:.15},{transform:'translateY(-4vh) scale(1.05)',offset:.22},{transform:'translateY(0) scale(1.12)'}],
    [{transform:'scale(2.6) rotate(8deg)',opacity:0},{transform:'scale(1) rotate(0)',opacity:1,offset:.14},{transform:'scale(1.15) rotate(-1.5deg)'}],
    [{transform:'translateX(120vw) skewX(-32deg) rotate(10deg)',opacity:1},{transform:'translateX(0) skewX(6deg) rotate(-1deg)',offset:.14},{transform:'translateX(0) scale(1.12)'}]
  ];

  function doFlash(c,o){
    flash.style.background=c;
    flash.animate([{opacity:o},{opacity:0}],{duration:380,easing:'ease-out'});
  }
  function shake(a){
    const p=a||12;
    stage.animate([
      {transform:'translate(0,0)'},{transform:`translate(${-p}px,${p/2}px)`},
      {transform:`translate(${p}px,${-p/2}px)`},{transform:`translate(${-p/2}px,${-p}px)`},{transform:'translate(0,0)'}
    ],{duration:220});
  }
  function pop(){
    const d=document.createElement('div');d.className='pop';
    d.textContent=WORDS[Math.random()*WORDS.length|0];
    d.style.left=(5+Math.random()*50)+'vw';
    d.style.top=(Math.random()<.5?(4+Math.random()*18):(66+Math.random()*20))+'vh';
    const rot=(Math.random()*30-15);
    txt.appendChild(d);
    d.animate([
      {transform:`scale(0) rotate(${rot-20}deg)`,opacity:0},
      {transform:`scale(1.35) rotate(${rot}deg)`,opacity:1,offset:.15},
      {transform:`scale(1) rotate(${rot}deg)`,opacity:1,offset:.25},
      {transform:`scale(1.12) rotate(${rot}deg)`,opacity:1,offset:.8},
      {transform:`scale(1.4) rotate(${rot}deg)`,opacity:0}
    ],{duration:1000,easing:'cubic-bezier(.2,.9,.2,1)'}).onfinish=()=>d.remove();
  }

  let order=[],oi=0,cur=null,count=0,timer=null;
  function pick(){
    if(oi>=order.length){const prev=order[order.length-1];order=shuffle(loaded.slice());if(order[0]===prev&&order.length>1)order.push(order.shift());oi=0}
    return order[oi++];
  }
  function slide(){
    if(!playing)return;
    cur=pick();count++;
    drawLow(cur);
    const dur=1000+Math.random()*700;
    const big=count%4===0;
    photo.getAnimations().forEach(a=>a.cancel());
    photo.animate(EFFECTS[Math.random()*EFFECTS.length|0],{duration:dur,easing:'cubic-bezier(.16,.9,.25,1)',fill:'forwards'});
    photo.animate([{filter:GB},{filter:GL,offset:.12},{filter:G,offset:.3},{filter:G}],{duration:dur});
    doFlash(big?'#fff':'#ff8a00',big?.95:.7);
    shake(big?24:12);
    power=big?1.3:1;
    pop();if(big)setTimeout(pop,220);
    timer=setTimeout(slide,dur);
  }

  /* pulso de "beat" aproximado */
  setInterval(()=>{if(!playing)return;power=Math.max(power,.85);stage.animate([{transform:'scale(1)'},{transform:'scale(1.025)'},{transform:'scale(1)'}],{duration:260})},430);

  /* ---------- REPRODUCIR ---------- */
  $('play').addEventListener('click',()=>{
    wantPlay=true;
    if(ytReady&&player){try{player.unMute();player.setVolume(100);player.playVideo()}catch(e){}}
    $('intro').classList.add('hide');
    base=.5;
    const start=()=>{
      if(pending>0){setTimeout(start,150);return}
      if(!loaded.length){alert('No se han podido cargar las fotos.');return}
      playing=true;slide();
    };
    start();
  });

  /* ---------- PANTALLA COMPLETA ---------- */
  $('fs').addEventListener('click',()=>{
    const d=document,e=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}
  });
})();
</script>
</body>
